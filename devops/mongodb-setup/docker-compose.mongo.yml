version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: cloudvault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      # Persistent volume so data survives container restarts/rebuilds
      - mongo_data:/data/db
      # Init scripts run once, only on first container start (empty volume)
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cloudvault-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local

networks:
  cloudvault-network:
    external: true
    name: cloudvault-network
